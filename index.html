<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeremy Dev Design - Apps</title>
<meta name="description" content="iPhone apps by Jeremy Dev Design, with links to support and privacy pages.">
<style>
:root { --ink: #1f2316; --ink-muted: #6b6f5e; --page-bg: #f7f6f2; --card-bg: #ffffff; --border: #e4e0d2; --link: #2f4a7a; }
@media (prefers-color-scheme: dark) {
  :root { --ink: #ecebe3; --ink-muted: #a5a796; --page-bg: #151714; --card-bg: #1e211c; --border: #33372f; --link: #a9c1ee; }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 0 20px 80px; background: var(--page-bg); color: var(--ink);
  font: 400 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 680px; margin: 0 auto; }
header { padding: 56px 0 28px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
h1 { font-size: 30px; line-height: 1.25; font-weight: 600; margin: 0 0 8px; }
.lede { font-size: 18px; color: var(--ink-muted); margin: 0; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 22px 26px; margin: 20px 0; }
.card h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
.card p { margin: 0 0 12px; color: var(--ink-muted); }
a { color: var(--link); }
.links a { margin-right: 18px; }
@media (max-width: 520px) { header { padding-top: 36px; } h1 { font-size: 26px; } .card { padding: 20px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Jeremy Dev Design</h1>
  <p class="lede">Independent iPhone apps made in Singapore.</p>
</header>

<div class="card">
  <h2>IPPT Encik</h2>
  <p>IPPT score calculator and logbook.</p>
  <div class="links"><a href="/ipptencik-support/">Support</a><a href="/ipptencik-support/privacy.html">Privacy</a></div>
</div>

<div class="card">
  <h2>FireNow</h2>
  <p>Personal finance and FIRE planning for Singapore.</p>
  <div class="links"><a href="/firenow-support/">Support</a><a href="/firenow-support/privacy.html">Privacy</a></div>
</div>
</div>
</body>
</html>
